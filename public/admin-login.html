<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Boston Enterprise — Admin sign in</title><link rel="stylesheet" href="/styles.css"><style>body{min-height:100vh;display:grid;place-items:center;background:var(--paper)}.login-card{width:min(430px,90vw);padding:36px;background:white;border:1px solid var(--line)}.login-card h1{font-size:34px;letter-spacing:-1.5px;margin:10px 0}.login-card p{font-size:13px;color:var(--muted);line-height:1.6}.login-card label{display:block;font-size:12px;font-weight:600;margin-top:20px}.login-card input{display:block;width:100%;padding:13px 12px;margin-top:8px;border:1px solid var(--line);font-size:16px}.login-card button{margin-top:24px;width:100%;justify-content:center}.login-error{color:#b43c3c;font-size:12px;margin-top:14px}</style></head><body><main class="login-card"><p class="eyebrow"><span class="small-dot"></span> PRIVATE ADMIN PANEL</p><h1>Sign in</h1><p>Use the authorised phone number and PIN to review enquiries.</p><form id="login-form"><label>Phone number<input name="phone" type="tel" autocomplete="username" required></label><label>PIN code<input name="pin" type="password" inputmode="numeric" autocomplete="current-password" required></label><button class="button primary" type="submit">Continue</button><p class="login-error" id="login-error" hidden>That phone number or PIN is not recognised.</p></form></main><script>document.getElementById('login-form').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.currentTarget),b=e.currentTarget.querySelector('button'),err=document.getElementById('login-error');b.disabled=true;err.hidden=true;try{const r=await fetch('/api/admin-login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({phone:String(f.get('phone')).trim(),pin:String(f.get('pin')).trim()})});if(!r.ok)throw new Error();const d=await r.json();sessionStorage.setItem('bostonAdminSession',d.token);location.href='/admin.html';}catch{err.hidden=false;b.disabled=false;}});</script></body></html>
