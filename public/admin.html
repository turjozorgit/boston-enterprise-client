<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Boston Enterprise — Admin</title><link rel="stylesheet" href="/styles.css"><style>
.admin-shell{max-width:1280px;margin:auto;padding:42px 5.2%}.admin-head{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid var(--line);padding-bottom:25px;margin-bottom:28px}.admin-head h1{font-size:42px;letter-spacing:-2px;margin:9px 0 0}.admin-head p{color:var(--muted);font-size:13px;margin:0}.admin-controls{display:flex;gap:12px;align-items:center;margin-bottom:18px}.admin-controls select,.admin-controls input{border:1px solid var(--line);background:white;padding:11px;font-size:12px}.admin-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}.stat-card{border:1px solid var(--line);padding:18px;background:white}.stat-card strong{font-size:28px;font-weight:500;display:block}.stat-card span{font-size:10px;color:var(--muted);letter-spacing:1px}.admin-table{background:white;border:1px solid var(--line);overflow:auto}.admin-row{display:grid;grid-template-columns:130px 1fr 160px 130px;gap:18px;padding:16px 18px;border-bottom:1px solid var(--line);align-items:center;font-size:12px}.admin-row:last-child{border-bottom:0}.admin-row.header{background:#eef8fb;color:var(--muted);font-size:10px;letter-spacing:1px;text-transform:uppercase}.admin-row button{border:0;background:transparent;color:var(--blue);cursor:pointer;text-align:left}.status-pill{display:inline-block;padding:6px 9px;background:#e4f6fa;color:#146b91;font-size:10px;border-radius:20px}.empty-admin{padding:60px;text-align:center;color:var(--muted);font-size:13px}.detail{margin:20px 0;background:#f3f8fa;border:1px solid var(--line);padding:20px}.detail dl{display:grid;grid-template-columns:150px 1fr;gap:10px;font-size:12px}.detail dt{color:var(--muted)}.detail dd{margin:0;white-space:pre-line}.admin-nav{display:flex;justify-content:space-between;align-items:center}.admin-nav .brand{transform-origin:left center;transform:scale(.84)}@media(max-width:700px){.admin-shell{padding:28px 6%}.admin-head{display:block}.admin-head h1{font-size:34px}.admin-stats{grid-template-columns:1fr}.admin-row{grid-template-columns:1fr 1fr;gap:9px}.admin-row.header{display:none}.admin-row button{font-size:11px}}
</style></head><body><header class="header admin-nav"><a class="brand brand-full-logo" href="/" aria-label="Boston Enterprise home"><img src="/assets/boston-enterprise-option-9-final.png" alt="Boston Enterprise"></a><a class="text-link" href="/">Back to website ↗</a></header><main class="admin-shell"><div class="admin-head"><div><p class="eyebrow"><span class="small-dot"></span> PRIVATE ADMIN PANEL</p><h1>Enquiries</h1><p>Review and manage enquiries prepared through the Boston Enterprise website.</p></div><button class="button secondary" id="clear-all">Clear all</button></div><div class="admin-stats"><div class="stat-card"><strong id="total">0</strong><span>TOTAL ENQUIRIES</span></div><div class="stat-card"><strong id="new-count">0</strong><span>NEW</span></div><div class="stat-card"><strong id="reviewed-count">0</strong><span>IN REVIEW / CLOSED</span></div></div><div class="admin-controls"><input id="search" placeholder="Search enquiries" aria-label="Search enquiries"><select id="filter" aria-label="Filter enquiries"><option value="all">All statuses</option><option value="New">New</option><option value="In review">In review</option><option value="Closed">Closed</option></select></div><section class="admin-table"><div class="admin-row header"><div>ID</div><div>Service</div><div>Created</div><div>Status</div></div><div id="rows"></div></section></main><script>
const key='bostonEnquiries';let records=JSON.parse(localStorage.getItem(key)||'[]');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(key,JSON.stringify(records))}function render(){const q=document.getElementById('search').value.toLowerCase(),f=document.getElementById('filter').value;const shown=records.filter(r=>(f==='all'||r.status===f)&&JSON.stringify(r).toLowerCase().includes(q));document.getElementById('total').textContent=records.length;document.getElementById('new-count').textContent=records.filter(r=>r.status==='New').length;document.getElementById('reviewed-count').textContent=records.filter(r=>r.status!=='New').length;document.getElementById('rows').innerHTML=shown.length?shown.map((r,i)=>{const service=(r.data.find(x=>x[0]==='Service')||[])[1]||'General guidance';return `<div class="admin-row"><button data-id="${r.id}">${esc(r.id)}</button><div>${esc(service)}</div><div>${new Date(r.createdAt).toLocaleString()}</div><div><select data-status="${r.id}" class="status-pill"><option ${r.status==='New'?'selected':''}>New</option><option ${r.status==='In review'?'selected':''}>In review</option><option ${r.status==='Closed'?'selected':''}>Closed</option></select></div></div>`}).join(''):`<div class="empty-admin">No enquiries found yet.</div>`;document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>detail(b.dataset.id));document.querySelectorAll('[data-status]').forEach(s=>s.onchange=()=>{const r=records.find(x=>x.id===s.dataset.status);r.status=s.value;save();render()})}function detail(id){const r=records.find(x=>x.id===id);const rows=r.data.map(x=>`<div><dt>${esc(x[0])}</dt><dd>${esc(x[1])}</dd></div>`).join('');document.getElementById('rows').innerHTML=`<div class="detail"><button class="quiet-button" onclick="render()">← Back to enquiries</button><h2>${esc(r.id)}</h2><p class="status-pill">${esc(r.status)}</p><dl>${rows}</dl></div>`}document.getElementById('search').oninput=render;document.getElementById('filter').onchange=render;document.getElementById('clear-all').onclick=()=>{if(confirm('Clear all saved enquiries?')){records=[];save();render()}};render();</script></body></html>
